server {
    listen 80;
    listen [::]:80;
    server_name article.lawyerworkbench.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/article-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name article.lawyerworkbench.cloud;

    ssl_certificate /etc/letsencrypt/live/article.lawyerworkbench.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/article.lawyerworkbench.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    client_max_body_size 1m;
    limit_req_status 429;

    location = /source.tar.gz {
        alias /var/www/article-source/wechat-markdown-editor-source.tar.gz;
        default_type application/gzip;
        add_header Content-Disposition 'attachment; filename="wechat-markdown-editor-source.tar.gz"';
    }

    location = /api/auth/login {
        limit_req zone=article_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/api/ai/(layout|providers/(models|test))$ {
        limit_req zone=article_ai burst=2 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
    }
}
